<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giảm Đỉnh GLB - 3D Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            overflow-x: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 350px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            overflow-y: auto;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .viewer-container {
            flex: 1;
            display: flex;
            gap: 10px;
            padding: 10px;
        }
        .viewer {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.2);
            min-height: 400px;
            overflow: hidden;
        }
        .viewer-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            border-radius: 10px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #4CAF50;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }
        input[type="file"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
        }
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }
        .btn-export {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: white;
        }
        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }
        .info-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 12px;
        }
        .info-box h3 {
            margin-bottom: 10px;
            color: #4CAF50;
        }
        .info-item {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }
        .status.success {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4CAF50;
        }
        .status.error {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid #f44336;
        }
        .status.info {
            background: rgba(33, 150, 243, 0.3);
            border: 1px solid #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🔧 Giảm Đỉnh GLB</h1>
            
            <div class="input-group">
                <label for="fileInput">📁 Chọn file GLB:</label>
                <input type="file" id="fileInput" accept=".glb,.gltf" />
            </div>
            
            <div class="input-group">
                <label for="vertexInput">🎯 Số đỉnh mục tiêu:</label>
                <input type="number" id="vertexInput" value="2500" min="1" placeholder="Nhập số đỉnh" />
            </div>
            
            <button class="btn-primary" id="reduceBtn">⚡ Giảm Đỉnh</button>
            <button class="btn-primary" id="reduceColorBtn" style="background: linear-gradient(135deg, #9C27B0, #7B1FA2);">🎨 Giảm Đỉnh có Màu</button>
            <button class="btn-export" id="exportBtn" disabled>📤 Xuất JSON Tọa Độ</button>
            <button class="btn-export" id="exportColorBtn" disabled style="background: linear-gradient(135deg, #9C27B0, #7B1FA2);">🎨 Xuất JSON với Màu</button>
            
            <div id="status" class="status info" style="display: none;"></div>
            
            <div class="info-box" id="infoBox" style="display: none;">
                <h3>📊 Thông tin Model</h3>
                <div class="info-item">
                    <span>Đỉnh gốc:</span>
                    <span id="originalVertices">-</span>
                </div>
                <div class="info-item">
                    <span>Đỉnh sau giảm:</span>
                    <span id="reducedVertices">-</span>
                </div>
                <div class="info-item">
                    <span>Tam giác gốc:</span>
                    <span id="originalTriangles">-</span>
                </div>
                <div class="info-item">
                    <span>Tam giác sau giảm:</span>
                    <span id="reducedTriangles">-</span>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="viewer-container">
                <div class="viewer" id="originalViewer">
                    <div class="viewer-label">📥 Input (Gốc)</div>
                    <canvas id="originalCanvas"></canvas>
                </div>
                <div class="viewer" id="reducedViewer">
                    <div class="viewer-label">📤 Output (Đã giảm)</div>
                    <canvas id="reducedCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.19.0/meshopt_decoder.js"></script>
    <script>
        // Global variables
        let originalScene, originalCamera, originalRenderer, originalControls;
        let reducedScene, reducedCamera, reducedRenderer, reducedControls;
        let originalModel = null;
        let reducedModel = null;
        let originalVertices = [];
        let reducedVertices = [];
        let reducedVerticesWithColors = []; // Lưu vertices với màu sắc
        let gltfLoader;

        // Initialize
        function init() {
            // Wait for DOM to be ready
            setTimeout(() => {
                // Initialize original viewer
                const originalCanvas = document.getElementById('originalCanvas');
                if (!originalCanvas) {
                    console.error('Original canvas not found');
                    return;
                }
                
                originalScene = new THREE.Scene();
                originalScene.background = new THREE.Color(0x1a1a1a);
                
                const width = originalCanvas.clientWidth || 800;
                const height = originalCanvas.clientHeight || 600;
                
                originalCamera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
                originalCamera.position.set(5, 5, 5);
                originalRenderer = new THREE.WebGLRenderer({ canvas: originalCanvas, antialias: true });
                originalRenderer.setSize(width, height);
                originalRenderer.setPixelRatio(window.devicePixelRatio);
            
                if (typeof THREE.OrbitControls !== 'undefined') {
                    originalControls = new THREE.OrbitControls(originalCamera, originalCanvas);
                    originalControls.enableDamping = true;
                    originalControls.dampingFactor = 0.05;
                }

                // Add lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                originalScene.add(ambientLight);
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 10, 5);
                originalScene.add(directionalLight);
                
                // Add grid helper for reference
                const gridHelper = new THREE.GridHelper(10, 10);
                originalScene.add(gridHelper);

                // Initialize reduced viewer
                const reducedCanvas = document.getElementById('reducedCanvas');
                if (!reducedCanvas) {
                    console.error('Reduced canvas not found');
                    return;
                }
                
                reducedScene = new THREE.Scene();
                reducedScene.background = new THREE.Color(0x1a1a1a);
                
                const width2 = reducedCanvas.clientWidth || 800;
                const height2 = reducedCanvas.clientHeight || 600;
                
                reducedCamera = new THREE.PerspectiveCamera(75, width2 / height2, 0.1, 1000);
                reducedCamera.position.set(5, 5, 5);
                reducedRenderer = new THREE.WebGLRenderer({ canvas: reducedCanvas, antialias: true });
                reducedRenderer.setSize(width2, height2);
                reducedRenderer.setPixelRatio(window.devicePixelRatio);
            
                if (typeof THREE.OrbitControls !== 'undefined') {
                    reducedControls = new THREE.OrbitControls(reducedCamera, reducedCanvas);
                    reducedControls.enableDamping = true;
                    reducedControls.dampingFactor = 0.05;
                }

                // Add lights
                const ambientLight2 = new THREE.AmbientLight(0xffffff, 0.6);
                reducedScene.add(ambientLight2);
                const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight2.position.set(10, 10, 5);
                reducedScene.add(directionalLight2);
                
                // Add grid helper for reference
                const gridHelper2 = new THREE.GridHelper(10, 10);
                reducedScene.add(gridHelper2);

                // Initialize GLTF loader
                if (typeof THREE.GLTFLoader !== 'undefined') {
                    gltfLoader = new THREE.GLTFLoader();
                    console.log('GLTFLoader initialized');
                } else {
                    console.error('GLTFLoader not available');
                    showStatus('Lỗi: GLTFLoader chưa được load. Vui lòng tải lại trang.', 'error');
                }

                // Event listeners
                document.getElementById('fileInput').addEventListener('change', handleFileSelect);
                document.getElementById('reduceBtn').addEventListener('click', reduceVertices);
                document.getElementById('reduceColorBtn').addEventListener('click', reduceVerticesWithColor);
                document.getElementById('exportBtn').addEventListener('click', exportJSON);
                document.getElementById('exportColorBtn').addEventListener('click', exportJSONWithColors);

                // Handle window resize
                window.addEventListener('resize', onWindowResize);

                // Start animation loop
                animate();
                
                console.log('Initialization complete');
            }, 100);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) {
                console.log('No file selected');
                return;
            }

            console.log('File selected:', file.name);

            if (!gltfLoader) {
                showStatus('Lỗi: GLTFLoader chưa được load', 'error');
                console.error('GLTFLoader not available');
                return;
            }

            showStatus('Đang load file...', 'info');

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const arrayBuffer = e.target.result;
                    console.log('File read, size:', arrayBuffer.byteLength);
                    
                    gltfLoader.parse(arrayBuffer, '', (gltf) => {
                        console.log('GLTF parsed successfully', gltf);
                        
                        // Remove old model
                        if (originalModel) {
                            originalScene.remove(originalModel);
                            // Dispose geometry and materials
                            originalModel.traverse((child) => {
                                if (child.isMesh) {
                                    if (child.geometry) child.geometry.dispose();
                                    if (child.material) {
                                        if (Array.isArray(child.material)) {
                                            child.material.forEach(mat => mat.dispose());
                                        } else {
                                            child.material.dispose();
                                        }
                                    }
                                }
                            });
                        }

                        originalModel = gltf.scene;
                        originalScene.add(originalModel);
                        console.log('Model added to scene');

                        // Extract vertices
                        extractVertices(originalModel, originalVertices);
                        console.log('Extracted vertices:', originalVertices.length);

                        // Calculate bounding box and center
                        const box = new THREE.Box3().setFromObject(originalModel);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        
                        if (maxDim > 0) {
                            originalCamera.position.set(center.x + maxDim * 1.5, center.y + maxDim * 1.5, center.z + maxDim * 1.5);
                            originalCamera.lookAt(center);
                            if (originalControls) {
                                originalControls.target.copy(center);
                                originalControls.update();
                            }
                        }

                        // Update info
                        const triangles = countTriangles(originalModel);
                        updateInfo(originalVertices.length, 0, triangles, 0);
                        showStatus('Đã load model thành công!', 'success');
                        
                        // Force render
                        originalRenderer.render(originalScene, originalCamera);
                    }, (error) => {
                        console.error('Error parsing GLTF:', error);
                        showStatus('Lỗi khi parse GLB: ' + (error.message || error), 'error');
                    });
                } catch (error) {
                    console.error('Error reading file:', error);
                    showStatus('Lỗi khi đọc file: ' + error.message, 'error');
                }
            };
            reader.onerror = function(error) {
                console.error('FileReader error:', error);
                showStatus('Lỗi khi đọc file', 'error');
            };
            reader.readAsArrayBuffer(file);
        }

        function extractVertices(object, verticesArray) {
            verticesArray.length = 0;
            object.traverse((child) => {
                if (child.isMesh && child.geometry) {
                    const geometry = child.geometry;
                    if (geometry.attributes && geometry.attributes.position) {
                        const positions = geometry.attributes.position;
                        const matrix = new THREE.Matrix4();
                        child.updateMatrixWorld(true);
                        matrix.copy(child.matrixWorld);

                        for (let i = 0; i < positions.count; i++) {
                            const vertex = new THREE.Vector3();
                            vertex.fromBufferAttribute(positions, i);
                            vertex.applyMatrix4(matrix);
                            verticesArray.push({
                                x: vertex.x,
                                y: vertex.y,
                                z: vertex.z
                            });
                        }
                    }
                }
            });
        }
        
        function getVertexColorFromTexture(mesh, vertexIndex, uv) {
            // Try to get color from texture if available
            try {
                const material = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
                if (material && material.map) {
                    const texture = material.map;
                    // Case 1: Standard image texture (HTMLImageElement or ImageBitmap)
                    if (texture.image && texture.image.width && texture.image.height) {
                        const canvas = document.createElement('canvas');
                        canvas.width = texture.image.width;
                        canvas.height = texture.image.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(texture.image, 0, 0);
                        
                        if (uv) {
                            const x = Math.floor(Math.max(0, Math.min(1, uv.x)) * canvas.width);
                            const y = Math.floor(Math.max(0, Math.min(1, uv.y)) * canvas.height);
                            const imageData = ctx.getImageData(x, y, 1, 1);
                            return {
                                r: imageData.data[0],
                                g: imageData.data[1],
                                b: imageData.data[2],
                                hex: '#' + [imageData.data[0], imageData.data[1], imageData.data[2]]
                                    .map(c => c.toString(16).padStart(2, '0')).join('')
                            };
                        }
                    }
                    // Case 2: DataTexture (thường dùng trong GLB)
                    if (texture.image && texture.image.data && texture.image.width && texture.image.height) {
                        const { data, width, height } = texture.image;
                        if (uv) {
                            const x = Math.floor(Math.max(0, Math.min(1, uv.x)) * width);
                            const y = Math.floor(Math.max(0, Math.min(1, uv.y)) * height);
                            const idx = (y * width + x) * 4;
                            if (idx + 2 < data.length) {
                                const r = data[idx];
                                const g = data[idx + 1];
                                const b = data[idx + 2];
                                return {
                                    r,
                                    g,
                                    b,
                                    hex: '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('')
                                };
                            }
                        }
                    }
                }
            } catch (e) {
                console.warn('Error reading texture color:', e);
            }
            return null;
        }
        
        function getMaterialColor(mesh) {
            // Get color from material
            if (mesh.material) {
                const material = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
                if (material && material.color) {
                    return {
                        r: Math.floor(material.color.r * 255),
                        g: Math.floor(material.color.g * 255),
                        b: Math.floor(material.color.b * 255),
                        hex: '#' + material.color.getHexString()
                    };
                }
            }
            return null;
        }

        function reduceVertices() {
            if (!originalModel) {
                showStatus('Vui lòng load file GLB trước!', 'error');
                return;
            }

            const targetVertices = parseInt(document.getElementById('vertexInput').value);
            if (!targetVertices || targetVertices <= 0) {
                showStatus('Số đỉnh không hợp lệ!', 'error');
                return;
            }

            showStatus('Đang giảm đỉnh...', 'info');

            // Extract all vertices from original model first (with colors)
            const allVertices = [];
            originalModel.traverse((child) => {
                if (child.isMesh && child.geometry) {
                    const geometry = child.geometry;
                    if (geometry.attributes && geometry.attributes.position) {
                        const positions = geometry.attributes.position;
                        const uvs = geometry.attributes.uv;
                        const vertexColorsAttr = geometry.attributes.color;
                        const matrix = new THREE.Matrix4();
                        child.updateMatrixWorld(true);
                        matrix.copy(child.matrixWorld);

                        // Get material color
                        let materialColor = null;
                        if (child.material) {
                            const material = Array.isArray(child.material) ? child.material[0] : child.material;
                            if (material.color) {
                                materialColor = {
                                    r: Math.floor(material.color.r * 255),
                                    g: Math.floor(material.color.g * 255),
                                    b: Math.floor(material.color.b * 255),
                                    hex: '#' + material.color.getHexString()
                                };
                            }
                        }

                        for (let i = 0; i < positions.count; i++) {
                            const vertex = new THREE.Vector3();
                            vertex.fromBufferAttribute(positions, i);
                            vertex.applyMatrix4(matrix);
                            
                            const vertexData = {
                                x: vertex.x,
                                y: vertex.y,
                                z: vertex.z
                            };
                            
                            // Try to get color priority: vertexColor attribute > texture > material > gradient
                            let vertexColor = null;
                            
                            // 1) Vertex color attribute (nếu mesh đã có màu sẵn)
                            if (vertexColorsAttr) {
                                vertexColor = {
                                    r: Math.floor(vertexColorsAttr.getX(i) * 255),
                                    g: Math.floor(vertexColorsAttr.getY(i) * 255),
                                    b: Math.floor(vertexColorsAttr.getZ(i) * 255),
                                    hex: '#' + [
                                        Math.floor(vertexColorsAttr.getX(i) * 255),
                                        Math.floor(vertexColorsAttr.getY(i) * 255),
                                        Math.floor(vertexColorsAttr.getZ(i) * 255)
                                    ].map(c => c.toString(16).padStart(2, '0')).join('')
                                };
                            }
                            
                            // 2) Texture map
                            if (!vertexColor && uvs && child.material && child.material.map) {
                                const uv = new THREE.Vector2();
                                uv.fromBufferAttribute(uvs, i);
                                vertexColor = getVertexColorFromTexture(child, i, uv);
                            }
                            
                            // Use texture color, material color, or default gradient
                            if (vertexColor) {
                                vertexData.color = vertexColor;
                            } else if (materialColor) {
                                vertexData.color = materialColor;
                            } else {
                                // Default color based on position (gradient)
                                const normalizedY = (vertex.y + 10) / 20; // Normalize to 0-1
                                vertexData.color = {
                                    r: Math.floor(100 + normalizedY * 155),
                                    g: Math.floor(150 + normalizedY * 105),
                                    b: Math.floor(200 + normalizedY * 55),
                                    hex: '#' + [
                                        Math.floor(100 + normalizedY * 155),
                                        Math.floor(150 + normalizedY * 105),
                                        Math.floor(200 + normalizedY * 55)
                                    ].map(c => c.toString(16).padStart(2, '0')).join('')
                                };
                            }
                            
                            allVertices.push(vertexData);
                        }
                    }
                }
            });

            // Sample vertices to target count
            reducedVertices.length = 0;
            reducedVerticesWithColors.length = 0;
            if (allVertices.length > targetVertices) {
                const step = Math.ceil(allVertices.length / targetVertices);
                for (let i = 0; i < allVertices.length; i += step) {
                    reducedVertices.push({
                        x: allVertices[i].x,
                        y: allVertices[i].y,
                        z: allVertices[i].z
                    });
                    reducedVerticesWithColors.push(allVertices[i]); // Keep color info
                }
            } else {
                reducedVertices.push(...allVertices.map(v => ({x: v.x, y: v.y, z: v.z})));
                reducedVerticesWithColors.push(...allVertices);
            }
            
            // Remove old reduced model/points
            if (reducedModel) {
                reducedScene.remove(reducedModel);
                // Dispose if it's a Points object
                if (reducedModel.geometry) reducedModel.geometry.dispose();
                if (reducedModel.material) {
                    if (Array.isArray(reducedModel.material)) {
                        reducedModel.material.forEach(mat => mat.dispose());
                    } else {
                        reducedModel.material.dispose();
                    }
                }
            }

            // Create dots/points from reduced vertices instead of mesh
            if (reducedVertices.length > 0) {
                const positions = new Float32Array(reducedVertices.length * 3);
                for (let i = 0; i < reducedVertices.length; i++) {
                    positions[i * 3] = reducedVertices[i].x;
                    positions[i * 3 + 1] = reducedVertices[i].y;
                    positions[i * 3 + 2] = reducedVertices[i].z;
                }

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                // Create neon cyan material for dots
                const material = new THREE.PointsMaterial({
                    color: 0x00FFFF, // Cyan/neon blue
                    size: 0.1,
                    sizeAttenuation: true,
                    transparent: true,
                    opacity: 0.9,
                    blending: THREE.AdditiveBlending
                });

                reducedModel = new THREE.Points(geometry, material);
                reducedScene.add(reducedModel);

                // Calculate bounding box and center
                const box = new THREE.Box3().setFromObject(reducedModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                
                if (maxDim > 0) {
                    reducedCamera.position.set(center.x + maxDim * 1.5, center.y + maxDim * 1.5, center.z + maxDim * 1.5);
                    reducedCamera.lookAt(center);
                    if (reducedControls) {
                        reducedControls.target.copy(center);
                        reducedControls.update();
                    }
                }
            }

            // Update info
            const originalTriangles = countTriangles(originalModel);
            updateInfo(originalVertices.length, reducedVertices.length, originalTriangles, 0);

            // Enable export buttons
            document.getElementById('exportBtn').disabled = false;
            document.getElementById('exportColorBtn').disabled = false;
            showStatus('Giảm đỉnh thành công!', 'success');
        }
        
        function reduceVerticesWithColor() {
            if (!originalModel) {
                showStatus('Vui lòng load file GLB trước!', 'error');
                return;
            }

            const targetVertices = parseInt(document.getElementById('vertexInput').value);
            if (!targetVertices || targetVertices <= 0) {
                showStatus('Số đỉnh không hợp lệ!', 'error');
                return;
            }

            showStatus('Đang giảm đỉnh với màu sắc...', 'info');

            // Extract all vertices from original model with colors
            const allVertices = [];
            originalModel.traverse((child) => {
                if (child.isMesh && child.geometry) {
                    const geometry = child.geometry;
                    if (geometry.attributes && geometry.attributes.position) {
                        const positions = geometry.attributes.position;
                        const uvs = geometry.attributes.uv;
                        const vertexColorsAttr = geometry.attributes.color;
                        const matrix = new THREE.Matrix4();
                        child.updateMatrixWorld(true);
                        matrix.copy(child.matrixWorld);

                        // Get material color
                        let materialColor = null;
                        if (child.material) {
                            const material = Array.isArray(child.material) ? child.material[0] : child.material;
                            if (material.color) {
                                materialColor = {
                                    r: Math.floor(material.color.r * 255),
                                    g: Math.floor(material.color.g * 255),
                                    b: Math.floor(material.color.b * 255),
                                    hex: '#' + material.color.getHexString()
                                };
                            }
                        }

                        for (let i = 0; i < positions.count; i++) {
                            const vertex = new THREE.Vector3();
                            vertex.fromBufferAttribute(positions, i);
                            vertex.applyMatrix4(matrix);
                            
                            const vertexData = {
                                x: vertex.x,
                                y: vertex.y,
                                z: vertex.z
                            };
                            
                            // Try to get color priority: vertexColor attribute > texture > material > gradient
                            let vertexColor = null;
                            
                            // 1) Vertex color attribute (nếu mesh đã có màu sẵn)
                            if (vertexColorsAttr) {
                                vertexColor = {
                                    r: Math.floor(vertexColorsAttr.getX(i) * 255),
                                    g: Math.floor(vertexColorsAttr.getY(i) * 255),
                                    b: Math.floor(vertexColorsAttr.getZ(i) * 255),
                                    hex: '#' + [
                                        Math.floor(vertexColorsAttr.getX(i) * 255),
                                        Math.floor(vertexColorsAttr.getY(i) * 255),
                                        Math.floor(vertexColorsAttr.getZ(i) * 255)
                                    ].map(c => c.toString(16).padStart(2, '0')).join('')
                                };
                            }
                            
                            // 2) Texture map
                            if (!vertexColor && uvs && child.material && child.material.map) {
                                const uv = new THREE.Vector2();
                                uv.fromBufferAttribute(uvs, i);
                                vertexColor = getVertexColorFromTexture(child, i, uv);
                            }
                            
                            // Use texture color, material color, or default gradient
                            if (vertexColor) {
                                vertexData.color = vertexColor;
                            } else if (materialColor) {
                                vertexData.color = materialColor;
                            } else {
                                // Default color based on position (gradient)
                                const normalizedY = (vertex.y + 10) / 20; // Normalize to 0-1
                                vertexData.color = {
                                    r: Math.floor(100 + normalizedY * 155),
                                    g: Math.floor(150 + normalizedY * 105),
                                    b: Math.floor(200 + normalizedY * 55),
                                    hex: '#' + [
                                        Math.floor(100 + normalizedY * 155),
                                        Math.floor(150 + normalizedY * 105),
                                        Math.floor(200 + normalizedY * 55)
                                    ].map(c => c.toString(16).padStart(2, '0')).join('')
                                };
                            }
                            
                            allVertices.push(vertexData);
                        }
                    }
                }
            });

            // Sample vertices to target count
            reducedVertices.length = 0;
            reducedVerticesWithColors.length = 0;
            if (allVertices.length > targetVertices) {
                const step = Math.ceil(allVertices.length / targetVertices);
                for (let i = 0; i < allVertices.length; i += step) {
                    reducedVertices.push({
                        x: allVertices[i].x,
                        y: allVertices[i].y,
                        z: allVertices[i].z
                    });
                    reducedVerticesWithColors.push(allVertices[i]); // Keep color info
                }
            } else {
                reducedVertices.push(...allVertices.map(v => ({x: v.x, y: v.y, z: v.z})));
                reducedVerticesWithColors.push(...allVertices);
            }
            
            // Remove old reduced model/points
            if (reducedModel) {
                reducedScene.remove(reducedModel);
                // Dispose if it's a Points object
                if (reducedModel.geometry) reducedModel.geometry.dispose();
                if (reducedModel.material) {
                    if (Array.isArray(reducedModel.material)) {
                        reducedModel.material.forEach(mat => mat.dispose());
                    } else {
                        reducedModel.material.dispose();
                    }
                }
            }

            // Create colored points from reduced vertices with colors
            if (reducedVerticesWithColors.length > 0) {
                const positions = new Float32Array(reducedVerticesWithColors.length * 3);
                const colors = new Float32Array(reducedVerticesWithColors.length * 3);
                
                for (let i = 0; i < reducedVerticesWithColors.length; i++) {
                    const v = reducedVerticesWithColors[i];
                    positions[i * 3] = v.x;
                    positions[i * 3 + 1] = v.y;
                    positions[i * 3 + 2] = v.z;
                    
                    // Set color from vertex data
                    const color = v.color || { r: 255, g: 255, b: 255 };
                    colors[i * 3] = color.r / 255;
                    colors[i * 3 + 1] = color.g / 255;
                    colors[i * 3 + 2] = color.b / 255;
                }

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                // Create points material with vertex colors
                const material = new THREE.PointsMaterial({
                    size: 0.1,
                    sizeAttenuation: true,
                    transparent: true,
                    opacity: 0.9,
                    vertexColors: true, // Enable vertex colors
                    blending: THREE.AdditiveBlending
                });

                reducedModel = new THREE.Points(geometry, material);
                reducedScene.add(reducedModel);

                // Calculate bounding box and center
                const box = new THREE.Box3().setFromObject(reducedModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                
                if (maxDim > 0) {
                    reducedCamera.position.set(center.x + maxDim * 1.5, center.y + maxDim * 1.5, center.z + maxDim * 1.5);
                    reducedCamera.lookAt(center);
                    if (reducedControls) {
                        reducedControls.target.copy(center);
                        reducedControls.update();
                    }
                }
            }

            // Update info
            const originalTriangles = countTriangles(originalModel);
            updateInfo(originalVertices.length, reducedVertices.length, originalTriangles, 0);

            // Enable export buttons
            document.getElementById('exportBtn').disabled = false;
            document.getElementById('exportColorBtn').disabled = false;
            showStatus('Giảm đỉnh với màu sắc thành công!', 'success');
        }

        function countTriangles(object) {
            let count = 0;
            object.traverse((child) => {
                if (child.isMesh && child.geometry) {
                    const geometry = child.geometry;
                    if (geometry.index) {
                        count += geometry.index.count / 3;
                    } else if (geometry.attributes && geometry.attributes.position) {
                        count += geometry.attributes.position.count / 3;
                    }
                }
            });
            return Math.floor(count);
        }

        function updateInfo(origV, redV, origT, redT) {
            document.getElementById('originalVertices').textContent = origV.toLocaleString();
            document.getElementById('reducedVertices').textContent = redV.toLocaleString();
            document.getElementById('originalTriangles').textContent = origT.toLocaleString();
            document.getElementById('reducedTriangles').textContent = redT.toLocaleString();
            document.getElementById('infoBox').style.display = 'block';
        }

        function exportJSON() {
            if (reducedVertices.length === 0) {
                showStatus('Không có dữ liệu để xuất!', 'error');
                return;
            }

            const data = {
                metadata: {
                    totalVertices: reducedVertices.length,
                    exportDate: new Date().toISOString()
                },
                vertices: reducedVertices
            };

            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `vertices_${reducedVertices.length}_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showStatus('Đã xuất JSON thành công!', 'success');
        }
        
        function exportJSONWithColors() {
            if (reducedVerticesWithColors.length === 0) {
                showStatus('Không có dữ liệu để xuất!', 'error');
                return;
            }

            const data = {
                metadata: {
                    totalVertices: reducedVerticesWithColors.length,
                    exportDate: new Date().toISOString(),
                    hasColors: true
                },
                vertices: reducedVerticesWithColors.map(v => ({
                    x: v.x,
                    y: v.y,
                    z: v.z,
                    color: v.color || {
                        r: 255,
                        g: 255,
                        b: 255,
                        hex: '#ffffff'
                    }
                }))
            };

            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `vertices_colors_${reducedVerticesWithColors.length}_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showStatus('Đã xuất JSON với màu sắc thành công!', 'success');
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                if (type === 'success' || type === 'info') {
                    statusDiv.style.display = 'none';
                }
            }, 3000);
        }

        function onWindowResize() {
            const originalCanvas = document.getElementById('originalCanvas');
            const reducedCanvas = document.getElementById('reducedCanvas');
            
            if (originalCanvas && originalRenderer && originalCamera) {
                const width = originalCanvas.clientWidth || 800;
                const height = originalCanvas.clientHeight || 600;
                originalCamera.aspect = width / height;
                originalCamera.updateProjectionMatrix();
                originalRenderer.setSize(width, height);
            }

            if (reducedCanvas && reducedRenderer && reducedCamera) {
                const width = reducedCanvas.clientWidth || 800;
                const height = reducedCanvas.clientHeight || 600;
                reducedCamera.aspect = width / height;
                reducedCamera.updateProjectionMatrix();
                reducedRenderer.setSize(width, height);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (originalControls) originalControls.update();
            if (reducedControls) reducedControls.update();
            
            if (originalRenderer && originalScene && originalCamera) {
                originalRenderer.render(originalScene, originalCamera);
            }
            if (reducedRenderer && reducedScene && reducedCamera) {
                reducedRenderer.render(reducedScene, reducedCamera);
            }
        }

        // Initialize on load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
