<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Light Show - Phaser - Cất cánh và Kết hình</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a1a;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        #phaser-game {
            width: 100vw;
            height: 100vh;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
        }
        
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        button:hover {
            background: #357abd;
        }
        
        .status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            z-index: 200;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="info">
        <h3>🌺 Drone Light Show - Phaser</h3>
        <p id="phase-info">Chuẩn bị cất cánh...</p>
    </div>
    
    <div class="controls">
        <button onclick="restartShow()">Khởi động lại</button>
        <button onclick="togglePause()">Tạm dừng</button>
    </div>
    
    <div class="status" id="status-text"></div>
    <div id="phaser-game"></div>
    
    <script>
        // Màu sắc cho các drone
        const DRONE_COLORS = {
            purple: [0x8B5CF6, 0xA78BFA, 0xC4B5FD],
            pink: [0xEC4899, 0xF472B6, 0xF9A8D4],
            red: [0xEF4444, 0xF87171, 0xFCA5A5],
            orange: [0xF97316, 0xFB923C, 0xFDBA74],
            yellow: [0xEAB308, 0xFCD34D, 0xFDE047]
        };
        
        // Lớp Drone với particle emitter
        class DroneParticle extends Phaser.GameObjects.Container {
            constructor(scene, x, y, targetX, targetY, color, size = 3) {
                super(scene, x, y);
                
                this.scene = scene;
                this.startX = x;
                this.startY = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.color = color;
                this.size = size;
                
                // Tạo texture cho drone nếu chưa có
                this.createDroneTexture();
                
                // Tạo sprite chấm sáng
                this.droneSprite = scene.add.sprite(0, 0, 'drone_particle');
                this.droneSprite.setTint(color);
                this.droneSprite.setScale(size / 3);
                this.add(this.droneSprite);
                
                // Tạo particle emitter cho hiệu ứng glow
                this.emitter = scene.add.particles(0, 0, 'drone_particle', {
                    speed: { min: 10, max: 20 },
                    scale: { start: 0.3, end: 0 },
                    tint: color,
                    blendMode: 'ADD',
                    lifespan: 500,
                    frequency: 50,
                    quantity: 1,
                    emitZone: { type: 'edge', source: new Phaser.Geom.Circle(0, 0, size * 2), quantity: 1 }
                });
                
                this.emitter.startFollow(this);
                this.emitter.setVisible(false);
                
                // Trạng thái animation
                this.isFlying = false;
                this.isArrived = false;
                this.progress = 0;
                this.arrivalDelay = Math.random() * 2000; // Delay ngẫu nhiên để cất cánh
                this.flightDuration = 2000 + Math.random() * 1000; // Thời gian bay
                this.startTime = 0;
                
                // Hiệu ứng nhấp nháy
                this.twinkleTween = null;
                
                scene.add.existing(this);
            }
            
            createDroneTexture() {
                if (!this.scene.textures.exists('drone_particle')) {
                    const graphics = this.scene.add.graphics();
                    graphics.fillStyle(0xFFFFFF);
                    graphics.fillCircle(0, 0, 3);
                    graphics.generateTexture('drone_particle', 6, 6);
                    graphics.destroy();
                }
            }
            
            startTakeoff() {
                this.isFlying = true;
                this.startTime = this.scene.time.now;
                this.emitter.setVisible(true);
                
                // Hiệu ứng cất cánh - phát ra nhiều hạt hơn
                this.emitter.setConfig({
                    speed: { min: 30, max: 60 },
                    scale: { start: 0.5, end: 0 },
                    quantity: 3,
                    frequency: 30
                });
            }
            
            update() {
                if (!this.isFlying) {
                    // Chờ đến lượt cất cánh
                    if (this.scene.time.now >= this.scene.takeoffStartTime + this.arrivalDelay) {
                        this.startTakeoff();
                    }
                    return;
                }
                
                if (!this.isArrived) {
                    // Tính toán vị trí hiện tại dựa trên progress
                    const elapsed = this.scene.time.now - this.startTime;
                    this.progress = Math.min(elapsed / this.flightDuration, 1);
                    
                    // Easing function (ease-out)
                    const easedProgress = 1 - Math.pow(1 - this.progress, 3);
                    
                    // Cập nhật vị trí
                    this.x = this.startX + (this.targetX - this.startX) * easedProgress;
                    this.y = this.startY + (this.targetY - this.startY) * easedProgress;
                    
                    // Kiểm tra đã đến đích chưa
                    if (this.progress >= 1) {
                        this.arrive();
                    }
                } else {
                    // Hiệu ứng nhấp nháy sau khi đến đích
                    if (!this.twinkleTween) {
                        this.twinkleTween = this.scene.tweens.add({
                            targets: this.droneSprite,
                            alpha: { from: 0.6, to: 1 },
                            duration: 500 + Math.random() * 500,
                            yoyo: true,
                            repeat: -1,
                            ease: 'Sine.easeInOut'
                        });
                        
                        // Giảm particle khi đã đến đích
                        this.emitter.setConfig({
                            speed: { min: 5, max: 10 },
                            scale: { start: 0.2, end: 0 },
                            quantity: 1,
                            frequency: 100
                        });
                    }
                    
                    // Rung nhẹ tại vị trí đích
                    const drift = Math.sin(this.scene.time.now * 0.002) * 1;
                    this.x = this.targetX + drift;
                    this.y = this.targetY + Math.cos(this.scene.time.now * 0.002) * 1;
                }
            }
            
            arrive() {
                this.isArrived = true;
                this.x = this.targetX;
                this.y = this.targetY;
            }
        }
        
        // Scene chính
        class DroneShowScene extends Phaser.Scene {
            constructor() {
                super({ key: 'DroneShowScene' });
            }
            
            preload() {
                // Tạo texture cho particle
                const graphics = this.add.graphics();
                graphics.fillStyle(0xFFFFFF);
                graphics.fillCircle(0, 0, 3);
                graphics.generateTexture('drone_particle', 6, 6);
                graphics.destroy();
            }
            
            create() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                
                // Tạo background gradient
                this.createBackground();
                
                // Tạo thành phố phía dưới
                this.createCity();
                
                // Tạo mặt nước
                this.createWater();
                
                // Khởi tạo các drone
                this.drones = [];
                this.takeoffStartTime = 0;
                this.phase = 'preparing'; // preparing, taking-off, forming, complete
                
                // Status text - phải lấy trước khi startShow()
                this.statusText = document.getElementById('status-text');
                this.phaseInfo = document.getElementById('phase-info');
                
                // Tạo hình hoa
                this.createFlowerFormation();
                
                // Bắt đầu trình diễn
                this.startShow();
            }
            
            createBackground() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                
                // Gradient background
                const graphics = this.add.graphics();
                
                // Sky gradient
                for (let i = 0; i < height * 0.7; i++) {
                    const ratio = i / (height * 0.7);
                    const r = Math.floor(10 + ratio * 26);
                    const g = Math.floor(10 + ratio * 26);
                    const b = Math.floor(26 + ratio * 62);
                    graphics.fillStyle(Phaser.Display.Color.GetColor(r, g, b));
                    graphics.fillRect(0, i, width, 1);
                }
                
                graphics.generateTexture('sky_bg', width, height * 0.7);
                graphics.destroy();
                
                this.add.image(0, 0, 'sky_bg').setOrigin(0, 0);
            }
            
            createCity() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                const cityY = height * 0.7;
                
                const graphics = this.add.graphics();
                graphics.fillStyle(0x1a1a2e);
                graphics.fillRect(0, cityY, width, height - cityY);
                
                // Vẽ các tòa nhà
                const buildingCount = 20;
                for (let i = 0; i < buildingCount; i++) {
                    const x = (i / buildingCount) * width;
                    const width_building = 30 + Math.random() * 40;
                    const height_building = 50 + Math.random() * 100;
                    
                    graphics.fillStyle(0x2a2a4e);
                    graphics.fillRect(x, cityY, width_building, height_building);
                    
                    // Vẽ cửa sổ
                    for (let wy = 0; wy < height_building; wy += 15) {
                        for (let wx = 0; wx < width_building; wx += 10) {
                            if (Math.random() > 0.3) {
                                const brightness = 0.3 + Math.random() * 0.7;
                                graphics.fillStyle(Phaser.Display.Color.GetColor(
                                    255, 255, Math.floor(200 * brightness)
                                ));
                                graphics.fillRect(x + wx + 2, cityY + wy + 2, 6, 8);
                            }
                        }
                    }
                }
                
                graphics.generateTexture('city_bg', width, height - cityY);
                graphics.destroy();
                
                this.add.image(0, cityY, 'city_bg').setOrigin(0, 0);
            }
            
            createWater() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                const waterY = height * 0.7;
                
                const graphics = this.add.graphics();
                
                // Water gradient
                for (let i = 0; i < height - waterY; i++) {
                    const ratio = i / (height - waterY);
                    const alpha = 0.5 - ratio * 0.3;
                    const r = Math.floor(26 * alpha);
                    const g = Math.floor(26 * alpha);
                    const b = Math.floor(46 * alpha);
                    graphics.fillStyle(Phaser.Display.Color.GetColor(r, g, b));
                    graphics.fillRect(0, i, width, 1);
                }
                
                graphics.generateTexture('water_bg', width, height - waterY);
                graphics.destroy();
                
                this.waterImage = this.add.image(0, waterY, 'water_bg').setOrigin(0, 0);
                this.waterImage.setAlpha(0.6);
            }
            
            createFlowerFormation() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                const centerX = width / 2;
                const centerY = height / 3;
                
                const layers = 5;
                const petalsPerLayer = [8, 12, 16, 20, 24];
                
                // Tâm hoa (nhụy) - màu vàng/cam
                for (let i = 0; i < 15; i++) {
                    const angle = (i / 15) * Math.PI * 2;
                    const dist = Math.random() * 30;
                    const targetX = centerX + Math.cos(angle) * dist;
                    const targetY = centerY + Math.sin(angle) * dist;
                    const startX = centerX + (Math.random() - 0.5) * 100;
                    const startY = height + 50; // Bắt đầu từ dưới màn hình
                    const color = DRONE_COLORS.yellow[Math.floor(Math.random() * DRONE_COLORS.yellow.length)];
                    
                    const drone = new DroneParticle(this, startX, startY, targetX, targetY, color, 4);
                    this.drones.push(drone);
                }
                
                // Các lớp cánh hoa
                for (let layer = 0; layer < layers; layer++) {
                    const layerRadius = 40 + layer * 50;
                    const petals = petalsPerLayer[layer];
                    const colorArray = layer < 2 ? DRONE_COLORS.purple : 
                                      layer < 3 ? DRONE_COLORS.pink : 
                                      layer < 4 ? DRONE_COLORS.red : DRONE_COLORS.orange;
                    
                    for (let i = 0; i < petals; i++) {
                        const angle = (i / petals) * Math.PI * 2;
                        const targetX = centerX + Math.cos(angle) * layerRadius;
                        const targetY = centerY + Math.sin(angle) * layerRadius;
                        const startX = centerX + (Math.random() - 0.5) * 200;
                        const startY = height + 50 + Math.random() * 50;
                        const color = colorArray[Math.floor(Math.random() * colorArray.length)];
                        
                        const drone = new DroneParticle(this, startX, startY, targetX, targetY, color, 3);
                        this.drones.push(drone);
                        
                        // Thêm các chấm sáng phụ trên cánh
                        for (let j = 0; j < 3; j++) {
                            const offsetAngle = angle + (Math.random() - 0.5) * 0.5;
                            const offsetDist = layerRadius + (Math.random() - 0.5) * 30;
                            const px = centerX + Math.cos(offsetAngle) * offsetDist;
                            const py = centerY + Math.sin(offsetAngle) * offsetDist;
                            const pStartX = centerX + (Math.random() - 0.5) * 200;
                            const pStartY = height + 50 + Math.random() * 50;
                            
                            const pDrone = new DroneParticle(this, pStartX, pStartY, px, py, color, 2);
                            this.drones.push(pDrone);
                        }
                    }
                }
            }
            
            startShow() {
                this.phase = 'taking-off';
                this.takeoffStartTime = this.time.now;
                
                if (this.statusText) {
                    this.statusText.textContent = '🚁 Drone đang cất cánh...';
                }
                if (this.phaseInfo) {
                    this.phaseInfo.textContent = 'Giai đoạn: Cất cánh';
                }
                
                // Cập nhật status sau khi tất cả drone đã đến
                this.time.delayedCall(5000, () => {
                    this.phase = 'forming';
                    if (this.statusText) {
                        this.statusText.textContent = '✨ Đang kết thành hình hoa...';
                    }
                    if (this.phaseInfo) {
                        this.phaseInfo.textContent = 'Giai đoạn: Kết hình';
                    }
                });
                
                this.time.delayedCall(8000, () => {
                    this.phase = 'complete';
                    if (this.statusText) {
                        this.statusText.textContent = '🌺 Hình hoa đã hoàn thành!';
                    }
                    if (this.phaseInfo) {
                        this.phaseInfo.textContent = 'Giai đoạn: Hoàn thành';
                    }
                    
                    // Ẩn status text sau 2 giây
                    this.time.delayedCall(2000, () => {
                        if (this.statusText) {
                            this.statusText.textContent = '';
                        }
                    });
                });
            }
            
            update() {
                // Cập nhật tất cả drones
                this.drones.forEach(drone => {
                    drone.update();
                });
                
                // Cập nhật phản chiếu trên nước
                this.updateWaterReflection();
            }
            
            updateWaterReflection() {
                // Có thể thêm hiệu ứng phản chiếu động ở đây
                // Hiện tại sử dụng static background
            }
        }
        
        // Cấu hình Phaser
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'phaser-game',
            backgroundColor: '#0a0a1a',
            scene: DroneShowScene,
            physics: {
                default: 'arcade',
                arcade: {
                    debug: false
                }
            }
        };
        
        // Khởi tạo game
        let game;
        let isPaused = false;
        
        function initGame() {
            if (game) {
                game.destroy(true);
            }
            game = new Phaser.Game(config);
        }
        
        function restartShow() {
            initGame();
            isPaused = false;
        }
        
        function togglePause() {
            if (!game) return;
            if (isPaused) {
                game.scene.resume('DroneShowScene');
                isPaused = false;
            } else {
                game.scene.pause('DroneShowScene');
                isPaused = true;
            }
        }
        
        // Xử lý resize
        window.addEventListener('resize', () => {
            if (game) {
                game.scale.resize(window.innerWidth, window.innerHeight);
            }
        });
        
        // Khởi động game
        initGame();
    </script>
</body>
</html>
