<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Edge Point Extractor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        .content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 0;
            min-height: 600px;
        }
        .controls {
            background: #f8f9fa;
            padding: 30px;
            border-right: 2px solid #e9ecef;
        }
        .control-group {
            margin-bottom: 25px;
        }
        .control-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #495057;
            font-size: 14px;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        .file-input-label {
            display: block;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: 600;
        }
        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .file-name {
            margin-top: 10px;
            padding: 8px;
            background: white;
            border-radius: 6px;
            font-size: 12px;
            color: #6c757d;
            word-break: break-all;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #dee2e6;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }
        .range-value {
            display: inline-block;
            margin-left: 10px;
            font-weight: 600;
            color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        .btn-info {
            background: #17a2b8;
            color: white;
        }
        .btn-info:hover:not(:disabled) {
            background: #138496;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(23, 162, 184, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .viewer {
            position: relative;
            background: #2c3e50;
        }
        #canvas-container {
            width: 100%;
            height: 600px;
        }
        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 13px;
            backdrop-filter: blur(10px);
        }
        .stats div {
            margin: 5px 0;
        }
        .stats strong {
            color: #00d4ff;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            display: none;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔷 3D Model Edge Point Extractor</h1>
            <p>Trích xuất 2000 điểm đặc trưng từ viền vật thể 3D</p>
        </div>
        <div class="content">
            <div class="controls">
                <div class="control-group">
                    <label>Tải file 3D Model</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" accept=".glb,.gltf,.fbx">
                        <label for="fileInput" class="file-input-label">
                            📁 Chọn file GLB/GLTF/FBX
                        </label>
                    </div>
                    <div class="file-name" id="fileName">Chưa chọn file</div>
                </div>

                <div class="control-group">
                    <label>Số điểm: <span class="range-value" id="pointCountValue">2000</span></label>
                    <input type="range" id="pointCount" min="500" max="5000" value="2000" step="100">
                </div>

                <div class="control-group">
                    <label>Ngưỡng phát hiện viền: <span class="range-value" id="thresholdValue">0.7</span></label>
                    <input type="range" id="threshold" min="0.1" max="1.0" value="0.7" step="0.05">
                </div>

                <div class="control-group">
                    <button id="extractBtn" class="btn-primary" disabled>
                        🔍 Phân tích viền
                    </button>
                </div>

                <div class="control-group">
                    <button id="exportJson" class="btn-success" disabled>
                        💾 Xuất JSON
                    </button>
                    <button id="exportCsv" class="btn-info" disabled>
                        📊 Xuất CSV
                    </button>
                </div>
            </div>

            <div class="viewer">
                <div id="canvas-container"></div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div>Đang xử lý...</div>
                </div>
                <div class="stats" id="stats">
                    <div><strong>Vertices:</strong> <span id="vertexCount">0</span></div>
                    <div><strong>Điểm viền:</strong> <span id="edgeCount">0</span></div>
                    <div><strong>Trạng thái:</strong> <span id="status">Chờ file</span></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        let scene, camera, renderer;
        let model, edgePoints = [];
        let pointCloud;

        // Khởi tạo Three.js
        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2c3e50);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Ánh sáng
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            // Grid
            const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
            scene.add(gridHelper);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (model) {
                model.rotation.y += 0.005;
            }
            if (pointCloud) {
                pointCloud.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }

        // Xử lý file upload
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('fileName').textContent = file.name;
            document.getElementById('status').textContent = 'Đang tải...';
            document.getElementById('loading').classList.add('active');

            try {
                const arrayBuffer = await file.arrayBuffer();
                const loader = new THREE.GLTFLoader();
                
                loader.parse(arrayBuffer, '', (gltf) => {
                    if (model) scene.remove(model);
                    model = gltf.scene;
                    
                    // Căn giữa model
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    model.position.sub(center);
                    
                    // Scale model
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 3 / maxDim;
                    model.scale.multiplyScalar(scale);

                    scene.add(model);
                    
                    // Đếm vertices
                    let vertexCount = 0;
                    model.traverse((child) => {
                        if (child.isMesh && child.geometry) {
                            vertexCount += child.geometry.attributes.position.count;
                        }
                    });
                    
                    document.getElementById('vertexCount').textContent = vertexCount.toLocaleString();
                    document.getElementById('status').textContent = 'Đã tải';
                    document.getElementById('extractBtn').disabled = false;
                    document.getElementById('loading').classList.remove('active');
                    
                    camera.position.set(5, 5, 5);
                    camera.lookAt(0, 0, 0);
                }, (error) => {
                    console.error('Lỗi tải file:', error);
                    document.getElementById('status').textContent = 'Lỗi tải file';
                    document.getElementById('loading').classList.remove('active');
                });
            } catch (error) {
                console.error('Lỗi:', error);
                document.getElementById('status').textContent = 'Lỗi xử lý file';
                document.getElementById('loading').classList.remove('active');
            }
        });

        // Cập nhật giá trị slider
        document.getElementById('pointCount').addEventListener('input', (e) => {
            document.getElementById('pointCountValue').textContent = e.target.value;
        });

        document.getElementById('threshold').addEventListener('input', (e) => {
            document.getElementById('thresholdValue').textContent = e.target.value;
        });

        // Phát hiện điểm viền
        document.getElementById('extractBtn').addEventListener('click', () => {
            if (!model) return;

            document.getElementById('loading').classList.add('active');
            document.getElementById('status').textContent = 'Đang phân tích...';

            setTimeout(() => {
                const targetCount = parseInt(document.getElementById('pointCount').value);
                const threshold = parseFloat(document.getElementById('threshold').value);
                
                edgePoints = extractEdgePoints(model, targetCount, threshold);
                
                // Xóa point cloud cũ
                if (pointCloud) scene.remove(pointCloud);
                
                // Tạo point cloud mới
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(edgePoints.length * 3);
                
                edgePoints.forEach((point, i) => {
                    positions[i * 3] = point.x;
                    positions[i * 3 + 1] = point.y;
                    positions[i * 3 + 2] = point.z;
                });
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                
                const material = new THREE.PointsMaterial({
                    color: 0x00bfff,
                    size: 0.05,
                    sizeAttenuation: true
                });
                
                pointCloud = new THREE.Points(geometry, material);
                scene.add(pointCloud);
                
                // Ẩn model gốc
                if (model) model.visible = false;
                
                document.getElementById('edgeCount').textContent = edgePoints.length.toLocaleString();
                document.getElementById('status').textContent = 'Hoàn thành';
                document.getElementById('exportJson').disabled = false;
                document.getElementById('exportCsv').disabled = false;
                document.getElementById('loading').classList.remove('active');
            }, 100);
        });

        // Trích xuất điểm viền
        function extractEdgePoints(model, targetCount, threshold) {
            const allPoints = [];
            const normals = [];
            
            model.traverse((child) => {
                if (child.isMesh && child.geometry) {
                    const geometry = child.geometry;
                    const posAttr = geometry.attributes.position;
                    const normalAttr = geometry.attributes.normal;
                    
                    if (!posAttr || !normalAttr) return;
                    
                    const matrix = child.matrixWorld;
                    
                    for (let i = 0; i < posAttr.count; i++) {
                        const vertex = new THREE.Vector3(
                            posAttr.getX(i),
                            posAttr.getY(i),
                            posAttr.getZ(i)
                        );
                        vertex.applyMatrix4(matrix);
                        
                        const normal = new THREE.Vector3(
                            normalAttr.getX(i),
                            normalAttr.getY(i),
                            normalAttr.getZ(i)
                        );
                        normal.transformDirection(matrix);
                        
                        allPoints.push(vertex);
                        normals.push(normal);
                    }
                }
            });
            
            // Tính độ cong và chọn điểm viền
            const edgeScores = [];
            for (let i = 0; i < allPoints.length; i++) {
                let curvature = 0;
                const point = allPoints[i];
                const normal = normals[i];
                
                // So sánh với các điểm lân cận
                for (let j = 0; j < allPoints.length; j++) {
                    if (i === j) continue;
                    const dist = point.distanceTo(allPoints[j]);
                    if (dist < 0.5) {
                        const normalDiff = 1 - normal.dot(normals[j]);
                        curvature += normalDiff / (dist + 0.01);
                    }
                }
                
                edgeScores.push({ index: i, score: curvature });
            }
            
            // Sắp xếp theo điểm số và lấy top
            edgeScores.sort((a, b) => b.score - a.score);
            const selectedIndices = edgeScores.slice(0, Math.min(targetCount, edgeScores.length));
            
            return selectedIndices.map(item => allPoints[item.index]);
        }

        // Xuất JSON
        document.getElementById('exportJson').addEventListener('click', () => {
            const data = {
                pointCount: edgePoints.length,
                points: edgePoints.map((p, i) => ({
                    id: i,
                    x: parseFloat(p.x.toFixed(6)),
                    y: parseFloat(p.y.toFixed(6)),
                    z: parseFloat(p.z.toFixed(6))
                }))
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'edge_points.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        // Xuất CSV
        document.getElementById('exportCsv').addEventListener('click', () => {
            let csv = 'id,x,y,z\n';
            edgePoints.forEach((p, i) => {
                csv += `${i},${p.x.toFixed(6)},${p.y.toFixed(6)},${p.z.toFixed(6)}\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'edge_points.csv';
            a.click();
            URL.revokeObjectURL(url);
        });

        // Khởi động
        init();

        // Resize handler
        window.addEventListener('resize', () => {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
