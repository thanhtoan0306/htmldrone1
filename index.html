<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Light Show - Hiệu ứng chấm sáng màu sắc</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(to bottom, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
        }
        
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        button:hover {
            background: #357abd;
        }
    </style>
</head>
<body>
    <div class="info">
        <h3>🌺 Drone Light Show - Hiệu ứng chấm sáng màu sắc</h3>
        <p>Mô phỏng các chấm sáng màu sắc trong trình diễn drone</p>
    </div>
    
    <div class="controls">
        <button onclick="toggleAnimation()">Tạm dừng/Tiếp tục</button>
        <button onclick="changePattern()">Đổi mẫu</button>
        <button onclick="resetAnimation()">Khởi động lại</button>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Thiết lập kích thước canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Cấu hình
        let isAnimating = true;
        let currentPattern = 0;
        
        // Màu sắc cho các chấm sáng
        const colors = {
            purple: ['#8B5CF6', '#A78BFA', '#C4B5FD'],
            pink: ['#EC4899', '#F472B6', '#F9A8D4'],
            red: ['#EF4444', '#F87171', '#FCA5A5'],
            orange: ['#F97316', '#FB923C', '#FDBA74'],
            yellow: ['#EAB308', '#FCD34D', '#FDE047'],
            blue: ['#3B82F6', '#60A5FA', '#93C5FD']
        };
        
        // Lớp Drone (chấm sáng)
        class Drone {
            constructor(x, y, color, size = 3) {
                this.x = x;
                this.y = y;
                this.baseX = x;
                this.baseY = y;
                this.color = color;
                this.size = size;
                this.alpha = 0.8;
                this.pulseSpeed = Math.random() * 0.02 + 0.01;
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }
            
            update(time) {
                // Hiệu ứng nhấp nháy (twinkle)
                this.alpha = 0.5 + Math.sin(time * this.twinkleSpeed + this.twinklePhase) * 0.3;
                
                // Hiệu ứng rung nhẹ (drift)
                this.x = this.baseX + Math.sin(time * 0.001 + this.pulsePhase) * 2;
                this.y = this.baseY + Math.cos(time * 0.001 + this.pulsePhase) * 2;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                
                // Vẽ chấm sáng với hiệu ứng glow
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 3
                );
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(0.5, this.color + '80');
                gradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Vẽ chấm sáng chính
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // Tạo các mẫu hình dạng
        function createFlowerPattern(centerX, centerY, radius) {
            const drones = [];
            const layers = 5;
            const petalsPerLayer = [8, 12, 16, 20, 24];
            
            // Tâm hoa (nhụy) - màu vàng/cam
            for (let i = 0; i < 15; i++) {
                const angle = (i / 15) * Math.PI * 2;
                const dist = Math.random() * 30;
                const x = centerX + Math.cos(angle) * dist;
                const y = centerY + Math.sin(angle) * dist;
                const color = colors.yellow[Math.floor(Math.random() * colors.yellow.length)];
                drones.push(new Drone(x, y, color, 4));
            }
            
            // Các lớp cánh hoa
            for (let layer = 0; layer < layers; layer++) {
                const layerRadius = 40 + layer * 50;
                const petals = petalsPerLayer[layer];
                const colorArray = layer < 2 ? colors.purple : 
                                  layer < 3 ? colors.pink : 
                                  layer < 4 ? colors.red : colors.orange;
                
                for (let i = 0; i < petals; i++) {
                    const angle = (i / petals) * Math.PI * 2;
                    const x = centerX + Math.cos(angle) * layerRadius;
                    const y = centerY + Math.sin(angle) * layerRadius;
                    const color = colorArray[Math.floor(Math.random() * colorArray.length)];
                    drones.push(new Drone(x, y, color, 3));
                    
                    // Thêm các chấm sáng phụ trên cánh
                    for (let j = 0; j < 3; j++) {
                        const offsetAngle = angle + (Math.random() - 0.5) * 0.5;
                        const offsetDist = layerRadius + (Math.random() - 0.5) * 30;
                        const px = centerX + Math.cos(offsetAngle) * offsetDist;
                        const py = centerY + Math.sin(offsetAngle) * offsetDist;
                        drones.push(new Drone(px, py, color, 2));
                    }
                }
            }
            
            return drones;
        }
        
        function createWavePattern() {
            const drones = [];
            const waveCount = 3;
            const pointsPerWave = 50;
            
            for (let w = 0; w < waveCount; w++) {
                const waveY = canvas.height * 0.3 + w * (canvas.height * 0.2);
                const amplitude = 30 + w * 20;
                const frequency = 0.02 + w * 0.01;
                
                for (let i = 0; i < pointsPerWave; i++) {
                    const x = (i / pointsPerWave) * canvas.width;
                    const y = waveY + Math.sin(x * frequency) * amplitude;
                    const colorArray = w === 0 ? colors.pink : w === 1 ? colors.purple : colors.blue;
                    const color = colorArray[Math.floor(Math.random() * colorArray.length)];
                    drones.push(new Drone(x, y, color, 2.5));
                }
            }
            
            return drones;
        }
        
        function createScatteredPattern() {
            const drones = [];
            const count = 300;
            
            for (let i = 0; i < count; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height * 0.6;
                const colorArrays = [colors.pink, colors.purple, colors.red];
                const colorArray = colorArrays[Math.floor(Math.random() * colorArrays.length)];
                const color = colorArray[Math.floor(Math.random() * colorArray.length)];
                drones.push(new Drone(x, y, color, Math.random() * 2 + 1.5));
            }
            
            return drones;
        }
        
        function createSpiralPattern() {
            const drones = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const turns = 3;
            const points = 200;
            
            for (let i = 0; i < points; i++) {
                const t = (i / points) * turns * Math.PI * 2;
                const radius = (i / points) * 200;
                const x = centerX + Math.cos(t) * radius;
                const y = centerY + Math.sin(t) * radius;
                
                const progress = i / points;
                let color;
                if (progress < 0.2) color = colors.purple[0];
                else if (progress < 0.4) color = colors.pink[0];
                else if (progress < 0.6) color = colors.red[0];
                else if (progress < 0.8) color = colors.orange[0];
                else color = colors.yellow[0];
                
                drones.push(new Drone(x, y, color, 2.5));
            }
            
            return drones;
        }
        
        // Khởi tạo drones
        let drones = [];
        
        function initDrones() {
            drones = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 3;
            
            switch(currentPattern) {
                case 0:
                    drones = createFlowerPattern(centerX, centerY, 100);
                    break;
                case 1:
                    drones = createWavePattern();
                    break;
                case 2:
                    drones = createScatteredPattern();
                    break;
                case 3:
                    drones = createSpiralPattern();
                    break;
                default:
                    drones = createFlowerPattern(centerX, centerY, 100);
            }
        }
        
        // Vẽ thành phố phía dưới (background)
        function drawCity() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);
            
            // Vẽ các tòa nhà
            const buildingCount = 20;
            for (let i = 0; i < buildingCount; i++) {
                const x = (i / buildingCount) * canvas.width;
                const width = 30 + Math.random() * 40;
                const height = 50 + Math.random() * 100;
                const y = canvas.height * 0.7;
                
                ctx.fillStyle = '#2a2a4e';
                ctx.fillRect(x, y, width, height);
                
                // Vẽ cửa sổ sáng
                for (let wy = 0; wy < height; wy += 15) {
                    for (let wx = 0; wx < width; wx += 10) {
                        if (Math.random() > 0.3) {
                            ctx.fillStyle = `rgba(255, 255, 200, ${0.3 + Math.random() * 0.7})`;
                            ctx.fillRect(x + wx + 2, y + wy + 2, 6, 8);
                        }
                    }
                }
            }
        }
        
        // Vẽ mặt nước với phản chiếu
        function drawWater() {
            const waterY = canvas.height * 0.7;
            const gradient = ctx.createLinearGradient(0, waterY, 0, canvas.height);
            gradient.addColorStop(0, 'rgba(26, 26, 46, 0.5)');
            gradient.addColorStop(1, 'rgba(10, 10, 26, 0.8)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, waterY, canvas.width, canvas.height - waterY);
            
            // Phản chiếu của các chấm sáng
            drones.forEach(drone => {
                if (drone.y < waterY) {
                    const reflectY = waterY + (waterY - drone.y);
                    ctx.save();
                    ctx.globalAlpha = drone.alpha * 0.3;
                    ctx.fillStyle = drone.color;
                    ctx.beginPath();
                    ctx.arc(drone.x, reflectY, drone.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });
        }
        
        // Animation loop
        let startTime = Date.now();
        
        function animate() {
            if (!isAnimating) {
                requestAnimationFrame(animate);
                return;
            }
            
            const currentTime = Date.now();
            const elapsed = currentTime - startTime;
            
            // Xóa canvas
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Vẽ thành phố
            drawCity();
            
            // Vẽ mặt nước
            drawWater();
            
            // Cập nhật và vẽ các drones
            drones.forEach(drone => {
                drone.update(elapsed);
                drone.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        // Điều khiển
        function toggleAnimation() {
            isAnimating = !isAnimating;
            if (isAnimating) {
                startTime = Date.now() - (Date.now() - startTime);
            }
        }
        
        function changePattern() {
            currentPattern = (currentPattern + 1) % 4;
            initDrones();
        }
        
        function resetAnimation() {
            startTime = Date.now();
            initDrones();
        }
        
        // Khởi động
        initDrones();
        animate();
    </script>
</body>
</html>
