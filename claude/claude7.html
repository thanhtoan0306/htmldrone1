<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trái Tim Neon 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0015 0%, #1a0033 100%);
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff1493;
            text-align: center;
            font-size: 24px;
            text-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493;
            z-index: 10;
            animation: pulse 2s ease-in-out infinite;
        }
        #controlsHint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            font-size: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 15px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        #nextBtn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            border: 2px solid #ff1493;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff1493, 0 0 40px #ff1493;
            transition: all 0.3s ease;
            z-index: 10;
        }
        #nextBtn:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 0 30px #ff1493, 0 0 60px #ff1493;
        }
        #nextBtn:active {
            transform: translateX(-50%) scale(0.95);
        }
        #fileInput {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 14px;
            color: #fff;
            background: linear-gradient(135deg, #4169E1, #6495ED);
            border: 2px solid #4169E1;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px #4169E1;
            transition: all 0.3s ease;
            z-index: 10;
        }
        #fileInput:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 0 25px #4169E1;
        }
        #fileInput input[type="file"] {
            display: none;
        }
        #fileInputLabel {
            cursor: pointer;
            display: block;
        }
        #formationFileInput {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 14px;
            color: #fff;
            background: linear-gradient(135deg, #00FF00, #32CD32);
            border: 2px solid #00FF00;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px #00FF00;
            transition: all 0.3s ease;
            z-index: 10;
        }
        #formationFileInput:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 0 25px #00FF00;
        }
        #formationFileInput input[type="file"] {
            display: none;
        }
        #formationFileInputLabel {
            cursor: pointer;
            display: block;
        }
        #qrInputContainer {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #qrTextInput {
            padding: 10px 20px;
            font-size: 14px;
            border: 2px solid #FFD700;
            border-radius: 25px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            width: 250px;
        }
        #qrTextInput::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        #qrGenerateBtn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 2px solid #FFD700;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px #FFD700;
            transition: all 0.3s ease;
        }
        #qrGenerateBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #FFD700;
        }
        #qrGenerateBtn:active {
            transform: scale(0.95);
        }
        #textInputContainer {
            position: absolute;
            top: 230px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #textFormationInput {
            padding: 10px 20px;
            font-size: 14px;
            border: 2px solid #FF00FF;
            border-radius: 25px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            width: 250px;
        }
        #textFormationInput::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        #textGenerateBtn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #FF00FF, #FF69B4);
            border: 2px solid #FF00FF;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px #FF00FF;
            transition: all 0.3s ease;
        }
        #textGenerateBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #FF00FF;
        }
        #textGenerateBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="info">♥ Trái Tim Neon ♥</div>
    <div id="controlsHint">🖱️ Kéo chuột để xoay | Scroll để zoom | Giữ chuột giữa để pan</div>
    <div id="fileInput">
        <label id="fileInputLabel" for="modelFile">📁 Chọn file 3D (GLB/GLTF/FBX)</label>
        <input type="file" id="modelFile" accept=".glb,.gltf,.fbx" />
    </div>
    <div id="formationFileInput">
        <label id="formationFileInputLabel" for="formationFile">📊 Chọn file đội hình (JSON/CSV)</label>
        <input type="file" id="formationFile" accept=".json,.csv" />
    </div>
    <div id="qrInputContainer">
        <input type="text" id="qrTextInput" placeholder="Nhập nội dung để tạo QR code..." />
        <button id="qrGenerateBtn">🔲 Tạo QR</button>
    </div>
    <div id="textInputContainer">
        <input type="text" id="textFormationInput" placeholder="Nhập text để tạo đội hình..." />
        <button id="textGenerateBtn">✨ Tạo Text</button>
    </div>
    <button id="nextBtn">NEXT ➜</button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- QR Code library - thử nhiều CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // Kiểm tra và đợi thư viện load
        window.addEventListener('load', function() {
            // Kiểm tra xem QRCode đã load chưa
            if (typeof QRCode !== 'undefined') {
                console.log('QRCode library loaded successfully from qrcodejs');
            } else {
                console.warn('QRCode library not loaded, will use fallback API');
            }
        });
    </script>
    <script>
        let scene, camera, renderer, particles = [];
        const particleCount = 2000;
        let currentShape = 'heart'; // 'heart', 'sunflower', 'dna', 'tony', 'orbit', 'formation', 'model', 'qr', 'text'
        let isTransitioning = false;
        let csvCoordinates = []; // Lưu tọa độ từ CSV
        let modelCoordinates = []; // Lưu tọa độ từ model 3D
        let qrCoordinates = []; // Lưu tọa độ từ QR code
        let textCoordinates = []; // Lưu tọa độ từ text
        let loadedModel = null; // Lưu model đã load
        let gltfLoader, fbxLoader;
        let controls; // OrbitControls để điều khiển camera
        
        async function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            // Khởi tạo OrbitControls để điều khiển camera bằng chuột
            if (typeof THREE.OrbitControls !== 'undefined') {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true; // Smooth camera movement
                controls.dampingFactor = 0.05;
                controls.enableZoom = true;
                controls.enablePan = true;
                controls.minDistance = 5;
                controls.maxDistance = 50;
                controls.autoRotate = false; // Tắt auto rotate vì người dùng sẽ điều khiển
            } else {
                console.warn('OrbitControls không được load. Vui lòng kiểm tra CDN.');
            }
            
            // Khởi tạo loaders (kiểm tra xem có sẵn không)
            if (typeof THREE.GLTFLoader !== 'undefined') {
                gltfLoader = new THREE.GLTFLoader();
            } else {
                console.warn('GLTFLoader không được load. Vui lòng kiểm tra CDN.');
            }
            if (typeof THREE.FBXLoader !== 'undefined') {
                fbxLoader = new THREE.FBXLoader();
            } else {
                console.warn('FBXLoader không được load. Vui lòng kiểm tra CDN.');
            }
            
            await loadCSVCoordinates();
            createParticles();
            
            // Sự kiện nút Next
            document.getElementById('nextBtn').addEventListener('click', transitionToNextShape);
            
            // Sự kiện file input
            document.getElementById('modelFile').addEventListener('change', handleFileSelect);
            document.getElementById('formationFile').addEventListener('change', handleFormationFileSelect);
            
            // Sự kiện QR code generation
            document.getElementById('qrGenerateBtn').addEventListener('click', generateQRCode);
            document.getElementById('qrTextInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    generateQRCode();
                }
            });
            
            // Sự kiện text formation generation
            document.getElementById('textGenerateBtn').addEventListener('click', generateTextFormation);
            document.getElementById('textFormationInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    generateTextFormation();
                }
            });
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const fileName = file.name.toLowerCase();
            const fileExtension = fileName.split('.').pop();
            
            if (fileExtension === 'glb' || fileExtension === 'gltf') {
                loadGLTFModel(file);
            } else if (fileExtension === 'fbx') {
                loadFBXModel(file);
            } else {
                alert('File không được hỗ trợ! Vui lòng chọn file .glb, .gltf hoặc .fbx');
            }
        }
        
        function loadGLTFModel(file) {
            if (!gltfLoader) {
                alert('GLTFLoader chưa được load. Vui lòng tải lại trang.');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                try {
                    gltfLoader.parse(arrayBuffer, '', (gltf) => {
                        processLoadedModel(gltf.scene);
                    }, (error) => {
                        console.error('Error loading GLTF:', error);
                        alert('Lỗi khi load file GLTF: ' + (error.message || error));
                    });
                } catch (error) {
                    console.error('Error parsing GLTF:', error);
                    alert('Lỗi khi parse file GLTF: ' + error.message);
                }
            };
            reader.onerror = function() {
                alert('Lỗi khi đọc file!');
            };
            reader.readAsArrayBuffer(file);
        }
        
        function loadFBXModel(file) {
            if (!fbxLoader) {
                alert('FBXLoader chưa được load. Vui lòng tải lại trang.');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                try {
                    fbxLoader.parse(arrayBuffer, '', (fbx) => {
                        processLoadedModel(fbx);
                    }, (error) => {
                        console.error('Error loading FBX:', error);
                        alert('Lỗi khi load file FBX: ' + (error.message || error));
                    });
                } catch (error) {
                    console.error('Error parsing FBX:', error);
                    alert('Lỗi khi parse file FBX: ' + error.message);
                }
            };
            reader.onerror = function() {
                alert('Lỗi khi đọc file!');
            };
            reader.readAsArrayBuffer(file);
        }
        
        function handleFormationFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const fileName = file.name.toLowerCase();
            const fileExtension = fileName.split('.').pop();
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                if (fileExtension === 'csv') {
                    parseCSVFormation(text);
                } else if (fileExtension === 'json') {
                    parseJSONFormation(text);
                } else {
                    alert('File không được hỗ trợ! Vui lòng chọn file .json hoặc .csv');
                }
            };
            reader.onerror = function() {
                alert('Lỗi khi đọc file!');
            };
            reader.readAsText(file);
        }
        
        function parseCSVFormation(text) {
            try {
                const lines = text.trim().split(/\r?\n/);
                if (lines.length < 2) {
                    alert('File CSV không hợp lệ! Cần ít nhất 1 dòng dữ liệu.');
                    return;
                }
                
                // Thử parse nhiều format CSV khác nhau
                let coordinates = [];
                
                // Format 1: Drone_ID,Name,Time(s),Frame,X,Y,Z (như file5.csv)
                if (lines[0].includes('Frame') && lines[0].includes('X') && lines[0].includes('Y') && lines[0].includes('Z')) {
                    const headerParts = lines[0].split(',');
                    const xIndex = headerParts.findIndex(h => h.trim().toUpperCase() === 'X');
                    const yIndex = headerParts.findIndex(h => h.trim().toUpperCase() === 'Y');
                    const zIndex = headerParts.findIndex(h => h.trim().toUpperCase() === 'Z');
                    
                    if (xIndex >= 0 && yIndex >= 0 && zIndex >= 0) {
                        coordinates = lines
                            .slice(1)
                            .map((line) => {
                                const parts = line.split(',');
                                if (parts.length > Math.max(xIndex, yIndex, zIndex)) {
                                    const csvX = parseFloat(parts[xIndex]);
                                    const csvY = parseFloat(parts[yIndex]);
                                    const csvZ = parseFloat(parts[zIndex]);
                                    // Swap Y và Z để dựng Z lên 90 độ
                                    return {
                                        x: csvX,
                                        y: csvZ,
                                        z: csvY
                                    };
                                }
                                return null;
                            })
                            .filter(p => p !== null && Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(p.z));
                    }
                } else {
                    // Format 2: X,Y,Z hoặc x,y,z (không có header hoặc header đơn giản)
                    coordinates = lines
                        .map((line, index) => {
                            // Bỏ qua dòng đầu nếu có header
                            if (index === 0 && (line.toLowerCase().includes('x') || line.toLowerCase().includes('header'))) {
                                return null;
                            }
                            const parts = line.split(/[,\s]+/).filter(p => p.trim() !== '');
                            if (parts.length >= 3) {
                                const x = parseFloat(parts[0]);
                                const y = parseFloat(parts[1]);
                                const z = parseFloat(parts[2]);
                                return {
                                    x: x,
                                    y: z,  // Swap Y và Z
                                    z: y
                                };
                            }
                            return null;
                        })
                        .filter(p => p !== null && Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(p.z));
                }
                
                if (coordinates.length === 0) {
                    alert('Không tìm thấy tọa độ hợp lệ trong file CSV!');
                    return;
                }
                
                // Normalize và cập nhật
                normalizeAndUpdateFormation(coordinates, 'CSV');
            } catch (error) {
                console.error('Error parsing CSV:', error);
                alert('Lỗi khi parse file CSV: ' + error.message);
            }
        }
        
        function parseJSONFormation(text) {
            try {
                const data = JSON.parse(text);
                let coordinates = [];
                
                // Format 1: Array of objects với x, y, z
                if (Array.isArray(data)) {
                    coordinates = data
                        .map(item => {
                            if (typeof item === 'object' && item !== null) {
                                // Hỗ trợ nhiều tên field khác nhau
                                const x = item.x || item.X || item.position?.x || item.pos?.x || item[0];
                                const y = item.y || item.Y || item.position?.y || item.pos?.y || item[1];
                                const z = item.z || item.Z || item.position?.z || item.pos?.z || item[2];
                                
                                if (Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z)) {
                                    return {
                                        x: parseFloat(x),
                                        y: parseFloat(z),  // Swap Y và Z
                                        z: parseFloat(y)
                                    };
                                }
                            } else if (Array.isArray(item) && item.length >= 3) {
                                // Format: [[x, y, z], ...]
                                return {
                                    x: parseFloat(item[0]),
                                    y: parseFloat(item[2]),  // Swap Y và Z
                                    z: parseFloat(item[1])
                                };
                            }
                            return null;
                        })
                        .filter(p => p !== null && Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(p.z));
                } 
                // Format 2: Object với key "coordinates", "points", "positions", etc.
                else if (typeof data === 'object' && data !== null) {
                    const coordsArray = data.coordinates || data.points || data.positions || data.vertices || data.data;
                    if (Array.isArray(coordsArray)) {
                        coordinates = coordsArray
                            .map(item => {
                                if (Array.isArray(item) && item.length >= 3) {
                                    return {
                                        x: parseFloat(item[0]),
                                        y: parseFloat(item[2]),  // Swap Y và Z
                                        z: parseFloat(item[1])
                                    };
                                } else if (typeof item === 'object' && item !== null) {
                                    const x = item.x || item.X || item.position?.x || item.pos?.x;
                                    const y = item.y || item.Y || item.position?.y || item.pos?.y;
                                    const z = item.z || item.Z || item.position?.z || item.pos?.z;
                                    
                                    if (Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z)) {
                                        return {
                                            x: parseFloat(x),
                                            y: parseFloat(z),  // Swap Y và Z
                                            z: parseFloat(y)
                                        };
                                    }
                                }
                                return null;
                            })
                            .filter(p => p !== null && Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(p.z));
                    }
                }
                
                if (coordinates.length === 0) {
                    alert('Không tìm thấy tọa độ hợp lệ trong file JSON! Định dạng có thể là:\n- Array: [{x, y, z}, ...]\n- Array: [[x, y, z], ...]\n- Object: {coordinates: [[x, y, z], ...]}');
                    return;
                }
                
                // Normalize và cập nhật
                normalizeAndUpdateFormation(coordinates, 'JSON');
            } catch (error) {
                console.error('Error parsing JSON:', error);
                alert('Lỗi khi parse file JSON: ' + error.message);
            }
        }
        
        function normalizeAndUpdateFormation(coordinates, source) {
            if (coordinates.length === 0) return;
            
            // Tính center và scale để fit vào scene
            const xs = coordinates.map(p => p.x);
            const ys = coordinates.map(p => p.y);
            const zs = coordinates.map(p => p.z);
            
            const centerX = (Math.max(...xs) + Math.min(...xs)) / 2;
            const centerY = (Math.max(...ys) + Math.min(...ys)) / 2;
            const centerZ = (Math.max(...zs) + Math.min(...zs)) / 2;
            
            const rangeX = Math.max(...xs) - Math.min(...xs);
            const rangeY = Math.max(...ys) - Math.min(...ys);
            const rangeZ = Math.max(...zs) - Math.min(...zs);
            const maxRange = Math.max(rangeX, rangeY, rangeZ);
            
            // Scale để fit vào scene (khoảng -10 đến 10)
            const scale = maxRange > 0 ? 20 / maxRange : 1;
            
            // Normalize tọa độ
            csvCoordinates = coordinates.map(p => ({
                x: (p.x - centerX) * scale,
                y: (p.y - centerY) * scale,
                z: (p.z - centerZ) * scale
            }));
            
            console.log(`Loaded ${csvCoordinates.length} coordinates from ${source}`);
            
            // Hiển thị thông báo
            const infoDiv = document.getElementById('info');
            const originalText = infoDiv.innerHTML;
            infoDiv.innerHTML = `✅ Đã load ${csvCoordinates.length} điểm từ ${source}!`;
            infoDiv.style.color = '#00FF00';
            setTimeout(() => {
                infoDiv.innerHTML = originalText;
            }, 3000);
            
            // Cập nhật particles với tọa độ mới
            updateParticlesWithFormationCoordinates();
            
            // Tự động chuyển sang formation shape nếu chưa ở đó
            if (currentShape !== 'formation') {
                transitionToFormationShape();
            }
        }
        
        function updateParticlesWithFormationCoordinates() {
            particles.forEach((particle, i) => {
                if (csvCoordinates && csvCoordinates.length > 0) {
                    const csvIndex = i % csvCoordinates.length;
                    particle.userData.formationX = csvCoordinates[csvIndex].x;
                    particle.userData.formationY = csvCoordinates[csvIndex].y;
                    particle.userData.formationZ = csvCoordinates[csvIndex].z;
                }
            });
        }
        
        function transitionToFormationShape() {
            if (csvCoordinates.length === 0) return;
            
            isTransitioning = true;
            currentShape = 'formation';
            const infoDiv = document.getElementById('info');
            infoDiv.innerHTML = '🚁 Đội Hình Drone 🚁';
            infoDiv.style.color = '#00FF00';
            infoDiv.style.textShadow = '0 0 10px #00FF00, 0 0 20px #00FF00';
            
            // Cập nhật màu ánh sáng
            scene.children.forEach(child => {
                if (child instanceof THREE.PointLight) {
                    child.color.setHex(0x00FF00);
                }
            });
            
            // Cập nhật target và màu sắc particles
            particles.forEach((particle, i) => {
                particle.userData.targetX = particle.userData.formationX;
                particle.userData.targetY = particle.userData.formationY;
                particle.userData.targetZ = particle.userData.formationZ;
                particle.userData.startTime = Date.now() * 0.001 + Math.random() * 2;
                
                // Đổi màu sang xanh lá
                particle.material.color.setHSL(0.33 + Math.random() * 0.05, 1, 0.5 + Math.random() * 0.2);
            });
            
            setTimeout(() => {
                isTransitioning = false;
            }, 2000);
        }

            const canvas = document.createElement('canvas');

        function parseQRCanvasToPoints(canvas, text) {
            // Parse canvas thành points với giới hạn tối đa 2000 points
            const MAX_POINTS = 2000;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            const allPoints = [];
            
            // Đầu tiên, thu thập tất cả các pixel đen
            const step = 1; // Bắt đầu với step = 1 để có độ chính xác cao
            for (let y = 0; y < canvas.height; y += step) {
                for (let x = 0; x < canvas.width; x += step) {
                    const i = (y * canvas.width + x) * 4;
                    // Kiểm tra nếu pixel đen (R, G, B < 128)
                    if (pixels[i] < 128 && pixels[i + 1] < 128 && pixels[i + 2] < 128) {
                        allPoints.push({
                            x: (x - canvas.width / 2) * 0.04,
                            y: -(y - canvas.height / 2) * 0.04, // Đảo Y để hiển thị đúng
                            z: 0
                        });
                    }
                }
            }
            
            // Giới hạn số lượng points tối đa 2000
            let points = allPoints;
            if (allPoints.length > MAX_POINTS) {
                // Nếu có quá nhiều points, sample ngẫu nhiên để giữ lại MAX_POINTS points
                points = [];
                const indices = new Set();
                while (indices.size < MAX_POINTS) {
                    const randomIndex = Math.floor(Math.random() * allPoints.length);
                    if (!indices.has(randomIndex)) {
                        indices.add(randomIndex);
                        points.push(allPoints[randomIndex]);
                    }
                }
                console.log(`QR code có ${allPoints.length} points, đã giới hạn xuống ${MAX_POINTS} points`);
            }
            
            if (points.length > 0) {
                normalizeAndUpdateQRCoordinates(points, text);
            } else {
                alert('Không thể tạo QR code từ nội dung này!');
            }
        }

        function extractVerticesFromGeometry(geometry) {
            const vertices = [];
            
            if (geometry.attributes && geometry.attributes.position) {
                const positions = geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    vertices.push({
                        x: positions[i],
                        y: positions[i + 1],
                        z: positions[i + 2]
                    });
                }
            } else if (geometry.vertices) {
                // Legacy geometry format
                geometry.vertices.forEach(vertex => {
                    vertices.push({
                        x: vertex.x,
                        y: vertex.y,
                        z: vertex.z
                    });
                });
            }
            
            return vertices;
        }
        
        function traverseModel(object, vertices = []) {
            if (object.geometry) {
                const modelVertices = extractVerticesFromGeometry(object.geometry);
                // Apply object's world matrix to transform vertices
                const worldMatrix = new THREE.Matrix4();
                object.updateMatrixWorld(true);
                worldMatrix.copy(object.matrixWorld);
                
                modelVertices.forEach(vertex => {
                    const vector = new THREE.Vector3(vertex.x, vertex.y, vertex.z);
                    vector.applyMatrix4(worldMatrix);
                    vertices.push({
                        x: vector.x,
                        y: vector.y,
                        z: vector.z
                    });
                });
            }
            
            if (object.children) {
                object.children.forEach(child => {
                    traverseModel(child, vertices);
                });
            }
            
            return vertices;
        }

                            return {
                                x: csvX,
                                y: csvZ,  // Z trong CSV trở thành Y (chiều cao) trong Three.js
                                z: csvY   // Y trong CSV trở thành Z (depth) trong Three.js
                            };
                        }
                        return null;
                    })
                    .filter(p => p !== null && Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(p.z));

        function getTextPoints(text, numPoints) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 800;
            canvas.height = 200;
            
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 150px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            const points = [];
            
            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    const i = (y * canvas.width + x) * 4;
                    if (pixels[i] > 128) {
                        points.push({
                            x: (x - canvas.width / 2) / 40,
                            y: -(y - canvas.height / 2) / 40,
                            z: (Math.random() - 0.5) * 2
                        });
                    }
                }
            }
            
            // Lấy mẫu random nếu có quá nhiều điểm
            while (points.length > numPoints) {
                points.splice(Math.floor(Math.random() * points.length), 1);
            }
            
            // Thêm điểm random nếu thiếu
            while (points.length < numPoints) {
                const randomPoint = points[Math.floor(Math.random() * points.length)];
                points.push({
                    x: randomPoint.x + (Math.random() - 0.5) * 0.5,
                    y: randomPoint.y + (Math.random() - 0.5) * 0.5,
                    z: randomPoint.z + (Math.random() - 0.5) * 0.5
                });
            }
            
            return points;
        }
        
        function createParticles() {
            // Tạo điểm cho chữ TONY
            const tonyPoints = getTextPoints('TONY', particleCount);
            
            for (let i = 0; i < particleCount; i++) {
                const geometry = new THREE.SphereGeometry(0.05, 8, 8);
                const material = new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(0.95 + Math.random() * 0.05, 1, 0.5 + Math.random() * 0.3),
                    transparent: true,
                    opacity: 0.8
                });
                
                const particle = new THREE.Mesh(geometry, material);
                
                // Vị trí ngẫu nhiên ban đầu (phân tán rộng)
                particle.position.x = (Math.random() - 0.5) * 30;
                particle.position.y = (Math.random() - 0.5) * 30;
                particle.position.z = (Math.random() - 0.5) * 30;
                
                // Tính vị trí đích trên hình trái tim
                const t = (i / particleCount) * Math.PI * 2;
                const heartX = 16 * Math.pow(Math.sin(t), 3) * 0.3;
                const heartY = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.3;
                const heartZ = (Math.random() - 0.5) * 2;
                
                // Tính vị trí đích cho hoa hướng dương
                const angle = i * Math.PI * 2 / particleCount * 21; // Fibonacci spiral
                const radius = Math.sqrt(i / particleCount) * 8;
                const sunflowerX = Math.cos(angle) * radius;
                const sunflowerY = Math.sin(angle) * radius;
                const sunflowerZ = (Math.random() - 0.5) * 1.5;
                
                // Tính vị trí đích cho DNA xoắn kép
                const dnaT = (i / particleCount) * Math.PI * 8; // 4 vòng xoắn
                const dnaRadius = 2.5;
                const dnaHeight = 12;
                const strand = i % 2; // 2 chuỗi DNA
                const dnaAngle = dnaT + (strand * Math.PI);
                const dnaX = Math.cos(dnaAngle) * dnaRadius;
                const dnaZ = Math.sin(dnaAngle) * dnaRadius;
                const dnaY = (i / particleCount) * dnaHeight - dnaHeight / 2;
                
                // Vị trí cho chữ TONY
                const tonyPoint = tonyPoints[i];
                const tonyX = tonyPoint.x;
                const tonyY = tonyPoint.y;
                const tonyZ = tonyPoint.z;
                
                // Vị trí cho quỹ đạo Trái Đất - Mặt Trăng
                let orbitX, orbitY, orbitZ;
                if (i < 800) {
                    // Trái Đất (800 hạt)
                    const earthPhi = Math.acos(2 * (i / 800) - 1);
                    const earthTheta = Math.PI * (1 + Math.sqrt(5)) * i;
                    const earthRadius = 2;
                    orbitX = earthRadius * Math.sin(earthPhi) * Math.cos(earthTheta);
                    orbitY = earthRadius * Math.sin(earthPhi) * Math.sin(earthTheta);
                    orbitZ = earthRadius * Math.cos(earthPhi);
                } else if (i < 1000) {
                    // Mặt Trăng (200 hạt)
                    const moonIndex = i - 800;
                    const moonPhi = Math.acos(2 * (moonIndex / 200) - 1);
                    const moonTheta = Math.PI * (1 + Math.sqrt(5)) * moonIndex;
                    const moonRadius = 0.7;
                    const orbitDistance = 6;
                    orbitX = orbitDistance + moonRadius * Math.sin(moonPhi) * Math.cos(moonTheta);
                    orbitY = moonRadius * Math.sin(moonPhi) * Math.sin(moonTheta);
                    orbitZ = moonRadius * Math.cos(moonPhi);
                } else {
                    // Quỹ đạo (1000 hạt)
                    const orbitIndex = i - 1000;
                    const orbitAngle = (orbitIndex / 1000) * Math.PI * 2;
                    const orbitDistance = 6;
                    orbitX = Math.cos(orbitAngle) * orbitDistance;
                    orbitY = Math.sin(orbitAngle) * orbitDistance;
                    orbitZ = (Math.random() - 0.5) * 0.3;
                }
                
                // Vị trí cho đội hình từ CSV
                let formationX, formationY, formationZ;
                if (csvCoordinates && csvCoordinates.length > 0) {
                    // Map particles vào CSV coordinates (lặp lại nếu cần)
                    const csvIndex = i % csvCoordinates.length;
                    formationX = csvCoordinates[csvIndex].x;
                    formationY = csvCoordinates[csvIndex].y;
                    formationZ = csvCoordinates[csvIndex].z;
                } else {

                    formationX = (Math.random() - 0.5) * 10;
                    formationY = (Math.random() - 0.5) * 10;
                    formationZ = (Math.random() - 0.5) * 10;
                }
                
                // Vị trí cho model 3D
                let modelX, modelY, modelZ;
                if (modelCoordinates && modelCoordinates.length > 0) {
                    const modelIndex = i % modelCoordinates.length;
                    modelX = modelCoordinates[modelIndex].x;

                    modelZ = modelCoordinates[modelIndex].z;

                    const qrIndex = i % qrCoordinates.length;

                // Vị trí cho text formation

                }
                
                particle.userData = {

                    // Nếu đang ở chế độ orbit, cập nhật vị trí động
                    if (currentShape === 'orbit') {
                        const orbitIndex = particle.userData.orbitIndex;
                        if (orbitIndex >= 800 && orbitIndex < 1000) {
                            // Mặt Trăng quay quanh Trái Đất
                            const moonIndex = orbitIndex - 800;
                            const moonPhi = Math.acos(2 * (moonIndex / 200) - 1);
                            const moonTheta = Math.PI * (1 + Math.sqrt(5)) * moonIndex;
                            const moonRadius = 0.7;
                            const orbitDistance = 6;
                            const orbitAngle = time * 0.5; // Tốc độ quay
                            particle.userData.targetX = Math.cos(orbitAngle) * orbitDistance + moonRadius * Math.sin(moonPhi) * Math.cos(moonTheta);
                            particle.userData.targetY = Math.sin(orbitAngle) * orbitDistance + moonRadius * Math.sin(moonPhi) * Math.sin(moonTheta);
                            particle.userData.targetZ = moonRadius * Math.cos(moonPhi);
                        }
                    }
                    
                    // Tính lực hút về vị trí đích (vật lý đơn giản)
                    const dx = particle.userData.targetX - particle.position.x;
                    const dy = particle.userData.targetY - particle.position.y;
                    const dz = particle.userData.targetZ - particle.position.z;
                    
                    const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    
                    // Lực hút với damping (chậm hơn, như drone)
                    const force = 0.005;
                    const damping = 0.92;
                    
                    particle.userData.velocityX += dx * force;
                    particle.userData.velocityY += dy * force;
                    particle.userData.velocityZ += dz * force;
                    
                    // Giới hạn tốc độ tối đa (như drone)
                    const maxSpeed = 0.05;
                    const speed = Math.sqrt(
                        particle.userData.velocityX ** 2 + 
                        particle.userData.velocityY ** 2 + 
                        particle.userData.velocityZ ** 2
                    );
                    if (speed > maxSpeed) {
                        particle.userData.velocityX = (particle.userData.velocityX / speed) * maxSpeed;
                        particle.userData.velocityY = (particle.userData.velocityY / speed) * maxSpeed;
                        particle.userData.velocityZ = (particle.userData.velocityZ / speed) * maxSpeed;
                    }
                    
                    particle.userData.velocityX *= damping;
                    particle.userData.velocityY *= damping;
                    particle.userData.velocityZ *= damping;
                    
                    particle.position.x += particle.userData.velocityX;
                    particle.position.y += particle.userData.velocityY;
                    particle.position.z += particle.userData.velocityZ;
                    
                    // Dao động nhẹ khi đã đến vị trí
                    if (distance < 0.5) {
                        particle.position.y += Math.sin(time * 2 + i * 0.1) * 0.01;
                    }
                }
                
                // Hiệu ứng sáng lấp lánh
                particle.material.opacity = 0.6 + Math.sin(time * 3 + i * 0.5) * 0.2;
            });
            
            // Cập nhật OrbitControls (nếu có)
            if (controls) {
                controls.update();
            } else {
                // Chỉ xoay scene tự động nếu không có controls
                scene.rotation.y = Math.sin(time * 0.2) * 0.2;
                scene.rotation.x = Math.sin(time * 0.15) * 0.1;
            }
            
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Cập nhật controls nếu có
            if (controls) {
                controls.handleResize();
            }
        }
        
        init();
        animate();
    </script>
</body>
</html>
